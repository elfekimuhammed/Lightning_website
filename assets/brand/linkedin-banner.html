<!doctype html><html><head><meta charset="utf-8">
<style>
html,body{margin:0;padding:0}
body{width:1584px;height:396px;overflow:hidden;font-family:Manrope,system-ui,sans-serif}
.b{position:relative;width:1584px;height:396px;overflow:hidden;background:linear-gradient(100deg,#E3F6EC 0%,#E6F4F1 38%,#E1EEFB 100%)}
.glow{position:absolute;right:-120px;top:-160px;width:900px;height:620px;border-radius:50%;background:radial-gradient(closest-side,rgba(20,168,116,.20),rgba(11,109,214,.12) 55%,transparent);filter:blur(10px)}
.glow2{position:absolute;left:-200px;bottom:-260px;width:700px;height:520px;border-radius:50%;background:radial-gradient(closest-side,rgba(20,168,116,.14),transparent)}
.ghost{position:absolute;left:470px;top:-70px;height:540px;opacity:.07;transform:rotate(-8deg)}
.hair{position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,#14A874,#10A5A8 50%,#0B6DD6)}
.content{position:absolute;right:104px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:flex-end}
.brand{display:flex;align-items:center;gap:16px;margin-right:6px}
.brand img{height:64px}
.brand span{font:800 44px/1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.03em;color:#0D2233}
h1{margin:26px 0 0;font:800 52px/1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.045em;color:#0D2233;white-space:nowrap}
h1 em{font-style:normal;background:linear-gradient(90deg,#14A874,#10A5A8 45%,#0B6DD6);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{margin-top:20px;display:flex;align-items:center;gap:14px;color:#304A5C;font:700 17px/1 Manrope,sans-serif}
.tag i{width:5px;height:5px;border-radius:50%;background:#14A874}
.tag b{color:#0B6DD6;font-weight:800}
</style></head><body><div class="b">
<div class="glow"></div><div class="glow2"></div>

<div class="content">
  <div class="brand"><img src="lightning-mark.svg" alt=""><span>Lightning</span></div>
  <h1>All Your Money. <em>One Clear Picture.</em></h1>
  <div class="tag">Personal finance, made for Egypt<i></i>Your data stays on your computer<i></i><b>lightningeg.com</b></div>
</div>
<div class="hair"></div>
</div></body></html>
